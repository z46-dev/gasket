name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install gopls
        run: go install golang.org/x/tools/gopls

      - name: Run gopls quality checks
        shell: bash
        run: |
          set -o pipefail
          diagnostics_file="$(mktemp)"
          find . -path ./.git -prune -o -type f -name '*.go' -print0 |
            xargs -0 -r gopls check |
            tee "$diagnostics_file"
          if [[ -s "$diagnostics_file" ]]; then
            echo "gopls reported diagnostics."
            exit 1
          fi

      - name: Check Go formatting
        shell: bash
        run: |
          files="$(find . -path ./.git -prune -o -type f -name '*.go' -print0 | xargs -0 -r gofmt -l)"
          if [[ -n "$files" ]]; then
            echo "$files"
            exit 1
          fi

      - name: Check module files
        run: go mod tidy -diff

      - name: Check native Go correctness
        run: go vet ./...

      - name: Run Go tests with race detector
        run: go test -race ./...

      - name: Build all examples
        run: |
          for dir in ./examples/*; do
            if [[ -d "$dir" ]]; then
              echo "Building $dir"
              go build "$dir"
            fi
          done

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Scan Go dependencies and code
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-file: go.mod
          go-package: ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Go security analysis
        run: gosec ./...

  tag:
    name: Tag successful main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-and-test
      - vulnerability-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create next patch tag
        shell: bash
        run: |
          latest_tag="$(git tag --list | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1)"
          if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            next_tag="v0.0.1"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$next_tag" --message "Release $next_tag"
          git push origin "$next_tag"